---
# sweep_expired.yml
#
# Run on a schedule (cron) to find sessions past their TTL, stop the
# corresponding VM, mark the session destroyed, and hand the pool slot
# back for reset (status = 'resetting'). Does NOT delete the VM - pool
# slots are reused via release_reset.yml, not recreated from template
# each time.
#
# Cron example (every 10 minutes):
#   */10 * * * * ansible-playbook /opt/thepond/playbooks/sweep_expired.yml >> /var/log/thepond-sweep.log 2>&1

- name: Sweep and reclaim expired sessions
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Get expired sessions
      ansible.builtin.command:
        cmd: "python3 {{ sessions_db_script }} list-expired"
      register: expired_raw
      changed_when: false

    - name: Parse expired sessions
      ansible.builtin.set_fact:
        expired_sessions: "{{ expired_raw.stdout | from_json }}"

    - name: Stop expired VMs
      community.general.proxmox_kvm:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ vault_proxmox_api_token_secret }}"
        node: "{{ proxmox_node }}"
        vmid: "{{ item.vmid }}"
        state: stopped
        force: true
      loop: "{{ expired_sessions }}"
      loop_control:
        label: "{{ item.session_id }}"

    - name: Release each expired session (marks pool slot resetting)
      ansible.builtin.command:
        cmd: "python3 {{ sessions_db_script }} release --session-id {{ item.session_id }}"
      loop: "{{ expired_sessions }}"
      loop_control:
        label: "{{ item.session_id }}"
      changed_when: true
